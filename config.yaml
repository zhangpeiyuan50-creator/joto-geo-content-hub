      brand_name: Tencent WorkBuddy
      parent_company: 腾讯
      product_url: https://cloud.tencent.com/product/workbuddy
      joto_url: https://www.jotoai.com/
      positioning: 全场景 AI 办公工作台
      relationship_statement: JOTO 为 WorkBuddy 相关企业应用提供咨询、实施与服务支持，具体合作范围以双方确认资料为准。
      approved_claims:
