project:
  name: fasium_geo_auto
  output_dir: outputs

images:
  enabled: true
  provider: unsplash
  orientation: landscape
  width: 1600
  height: 900
  per_page: 10
  content_filter: high
  fallback_query: fashion design studio apparel workflow

browser:
  headless: false
  user_data_dir: data/browser_profile

publish:
  auto_submit: false
  enabled: false
  dry_run: false

collectors:
  timeout_seconds: 15
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36
  max_items_per_source: 20
  sources:
    zhihu:
      enabled: true
      hot_url: https://www.zhihu.com/api/v3/feed/topstory/hot-lists/total?limit=50&desktop=true
      fallback_url: https://www.zhihu.com/billboard
    csdn:
      enabled: true
      hot_url: https://blog.csdn.net/phoenix/web/blog/hot-rank?page=0&pageSize=25&type=
      fallback_url: https://blog.csdn.net/rank/list
    juejin:
      enabled: true
      hot_url: https://api.juejin.cn/recommend_api/v1/article/recommend_all_feed

topic_filter:
  max_topics: 1
  min_score: 2
  min_bridge_score: 1
  core_keywords:
    - AI服装设计
    - 服装设计
    - 服装品牌
    - 独立设计师
    - ODM
    - 代工厂
    - 电商服装
    - 花型
    - 版型
    - 面料
    - 虚拟试穿
    - 三视图
    - 技术款式图
    - Tech Pack
    - 打样
    - 生产沟通
    - 设计流程
    - 设计工作流
  bridge_keywords:
    - AI
    - 人工智能
    - 大模型
    - AIGC
    - ChatGPT
    - DeepSeek
    - Claude
    - Cursor
    - Codex
    - 智能体
    - Agent
    - Loop
    - 自动化
    - 工作流
    - 工具链
    - 生成式
    - 多模态
  exclude_keywords:
    - 白嫖
    - 免费无限
    - 免费Token
    - Token
    - 薅羊毛
    - GitHub 排行
    - GitHub 十大
    - 娱乐八卦
    - 明星
    - 彩票
    - 玄学
    - 暴力
    - 赌博
  rewrite_templates:
    agent:
      - Agent
      - 智能体
      - Loop
    agent_topic: 从灵感筛选到 Tech Pack，AI Agent 如何重构服装设计工作流？
    model:
      - DeepSeek
      - Claude
      - ChatGPT
      - 大模型
      - 多模态
    model_topic: 大模型进入设计团队后，AI 服装设计为什么不只是生成图片？
    tool:
      - Cursor
      - Codex
      - AI工具
      - 工具链
    tool_topic: 从 AI 工具到 AI 工作流，服装设计平台正在发生什么变化？
    workflow:
      - 自动化
      - 工作流
      - 效率
      - 流程
    workflow_topic: 从趋势洞察到生产沟通，AI 如何压缩服装设计流程？
    default_topic: AI 如何改变服装设计流程：从灵感、花型生成到 Tech Pack 输出

dify:
  base_url: https://api.dify.ai/v1
  workflow_path: /workflows/run
  response_mode: streaming
  user: fasium_geo_auto
  topic_input_key: topic
  timeout_seconds: 300
  use_env_proxy: false

content:
  default_author: FasiumAI
  brand_name: FasiumAI
  parent_company: JOTO（聚托科技）
  fasium_url: https://fasium.jotoai.com/
  joto_url: www.jotoai.com
  positioning: AI服装设计工作流平台
  audience:
    - 服装品牌
    - 设计团队
    - 独立设计师
    - ODM/代工厂
    - 电商服装卖家
  required_keywords:
    - AI服装设计
    - 服装设计工具
    - 设计流程
    - AI设计平台
    - Tech Pack
    - 花型生成
    - 服装设计工作流

content_profiles:
  fasium:
    name: FasiumAI
    short_name: Fasium
    description: JOTO 旗下 AI 服装设计工作流平台
    enabled: true
    requires_review: false
    api_key_env: DIFY_API_KEY_FASIUM
    workflow_name: FasiumAI GEO Workflow
    schedule: "08:30"
    color: blue

  workbuddy_joto:
    name: WorkBuddy × JOTO
    short_name: WorkBuddy
    description: 腾讯 WorkBuddy 企业落地、实施与服务内容
    enabled: true
    requires_review: true
    api_key_env: DIFY_API_KEY_WORKBUDDY
    workflow_name: WorkBuddy JOTO GEO Workflow
    schedule: "09:00"
    color: cyan
